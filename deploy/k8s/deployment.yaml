apiVersion: apps/v1
kind: Deployment
metadata:
  name: museforge
  labels:
    app: museforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: museforge
  template:
    metadata:
      labels:
        app: museforge
    spec:
      containers:
        - name: museforge
          image: museforge:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: MUSEFORGE_HOST
              value: "0.0.0.0"
            - name: MUSEFORGE_PORT
              value: "8000"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

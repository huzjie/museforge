[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "museforge"
version = "0.1.0"
description = "Active Memory + Active Focus engine for personal agents (Meta Muse Wonder direction, zero-dependency reference)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "museforge contributors" }]
keywords = ["agent-memory", "active-memory", "active-focus", "personal-agent", "llm", "retrieval"]

[project.scripts]
museforge = "museforge.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["museforge*"]
